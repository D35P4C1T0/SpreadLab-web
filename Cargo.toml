[workspace]
members = [
    "crates/pkmn-dmg-lib-rs",
    "crates/spreadlab",
    "crates/spreadlab-web",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.94.1"
license = "MIT"
repository = "https://github.com/D35P4C1T0/SpreadLab-web"

[workspace.dependencies]
damage_calc = { package = "pkmn-dmg-lib", version = "0.1.0", path = "crates/pkmn-dmg-lib-rs", features = ["serde"] }
spreadlab-rs = { version = "0.1.0", path = "crates/spreadlab" }
