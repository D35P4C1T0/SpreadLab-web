[package]
name = "spreadlab-web"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Dedicated Rust WebUI for the SpreadLab Pokémon Champions optimizer"
readme = "../../README.md"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["macros"] }
clap = { version = "4", features = ["derive"] }
leptos = { version = "0.8.6", features = ["ssr"] }
leptos_meta = { version = "0.8.6", features = ["ssr"] }
leptos_router = { version = "0.8.6", features = ["ssr"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
damage_calc = { package = "pkmn-dmg-lib", git = "https://github.com/D35P4C1T0/pkmn-dmg-lib-rs.git", rev = "96f55ef04e66d882457af4f009f228de0e73afdc", features = ["serde"] }
spreadlab-rs = { git = "https://github.com/D35P4C1T0/SpreadLab.git", rev = "f400166eb5468a58fd3c8c65f67c9f3533ab087d" }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }
tower-livereload = "0.10.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
