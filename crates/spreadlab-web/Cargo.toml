[package]
name = "spreadlab-web"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Dedicated Rust WebUI for the SpreadLab Pokémon Champions optimizer"
readme = "../../README.md"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["macros"] }
clap = { version = "4", features = ["derive"] }
leptos = { version = "0.8.6", features = ["ssr"] }
leptos_meta = { version = "0.8.6", features = ["ssr"] }
leptos_router = { version = "0.8.6", features = ["ssr"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
damage_calc.workspace = true
spreadlab-rs.workspace = true
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }
tower-livereload = "0.10.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
